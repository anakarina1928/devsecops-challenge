name: CI

on:
  pull_request:
    branches: [develop, "release/**", main]
  push:
    branches: [develop, "release/**", main, "hotfix/**"]

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:

  preflight-permissions:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verificar permiso de push a ACR
        run: |
          echo "Verificando acceso a ACR (devsecopschallenge2026)..."
          az acr login --name devsecopschallenge2026
          echo "OK: la identidad tiene permiso de push/pull sobre el ACR."

      - name: Verificar permiso de credenciales admin sobre AKS
        run: |
          echo "Verificando acceso al cluster AKS (aks-devsecops-challenge-ana)..."
          az aks get-credentials \
            --resource-group rg-devsecops-challenge \
            --name aks-devsecops-challenge-ana \
            --admin \
            --file /tmp/kubeconfig-check
          echo "OK: la identidad tiene permiso para obtener credenciales admin del cluster."

  build-test:
    needs: preflight-permissions
    uses: anakarina1928/devsecops-shared-workflows-challenge/.github/workflows/reusable-build-test.yml@main

  docker-build:
    needs: build-test
    uses: anakarina1928/devsecops-shared-workflows-challenge/.github/workflows/reusable-docker-build.yml@main
    with:
      registry: devsecopschallenge2026.azurecr.io
      image-name: microservicio
      image-tag: ${{ github.sha }}
      environment: dev
    secrets: inherit

  security-scan:
    needs: docker-build
    uses: anakarina1928/devsecops-shared-workflows-challenge/.github/workflows/reusable-security-scan.yml@main
    with:
      image-ref: ${{ needs.docker-build.outputs.full-image-ref }}
      environment: dev
    secrets: inherit
