name: "Production - Promocion manual a ambiente prod"

# Disparo exclusivamente manual. Quien lo ejecuta indica el tag de imagen
# (SHA del commit) que ya fue construido y validado en qa, para promoverlo
# a produccion SIN reconstruir ni re-escanear (build once, promote everywhere).
# Ademas del disparo manual, el job de despliegue corre bajo el Environment
# "prod", que tiene un revisor requerido: el pipeline queda pausado hasta
# su aprobacion explicita.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag de la imagen a promover a prod (SHA del commit que ya paso por qa)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  pipeline:
    name: "Promoviendo imagen validada hacia prod"
    uses: anakarina1928/devsecops-shared-workflows-challenge/.github/workflows/template-orchestrator.yml@main
    with:
      environment: prod
      namespace: prod
      registry: devsecopschallenge2026.azurecr.io
      image-name: microservicio
      image-tag: ${{ inputs.image_tag }}
      resource-group: rg-devsecops-challenge
      aks-cluster-name: aks-devsecops-challenge-ana
      skip-build: true
    secrets: inherit
